name: build

# Every push and pull request is vetted, tested and packaged on all three
# platforms with the same script used locally (cx.sh). Pushing a tag such as
# v1.2 also publishes the packages as a GitHub release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-latest, flags: "" }
          - { name: macos, os: macos-latest, flags: "--universal --dmg" }
          - { name: windows, os: windows-latest, flags: "" }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # cx.sh reads the version from the latest tag
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install raylib build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgl1-mesa-dev libx11-dev libxi-dev \
            libxcursor-dev libxrandr-dev libxinerama-dev libwayland-dev libxkbcommon-dev
      - name: Format
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Test, build and package
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            ./cx.sh --version "${GITHUB_REF_NAME#v}" ${{ matrix.flags }}
          else
            ./cx.sh ${{ matrix.flags }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: blockworld-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.dmg
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Blockworld ${GITHUB_REF_NAME#v}" --generate-notes
